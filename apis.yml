aid: brevis
name: Brevis
description: >-
  Brevis is a highly efficient ZK coprocessor and zkVM that empowers smart
  contracts to read from the full historical on-chain data across all supported
  blockchains and run customizable computations in a completely trust-free way.
  Developers build application circuits with the Brevis SDK (available in Go and
  TypeScript), implementing a Data Access Module to specify the historical
  blockchain data needed, an App Circuit for the computation logic, and an App
  Contract to receive ZK-verified or coChain-verified results on-chain. Brevis
  also operates ProverNet, an open marketplace for zero-knowledge proofs, and
  Pico, an open-source high-performance zkVM. Backed by Polychain.
